<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P/J AI Photo Editor - Sign In</title>
    <!-- P/J AI Studio Icon -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07030f">
    <link rel="apple-touch-icon" href="icon.png">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #07030f, #130a24, #1b103a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 410px;
            background: rgba(20, 15, 35, 0.7);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 255, 204, 0.25);
            padding: 30px 24px;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 255, 204, 0.1);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-header h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #00ffcc, #007bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .brand-header p {
            font-size: 12px;
            color: #9b9bb5;
        }

        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #9b9bb5;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00ffcc, #007bff);
            color: #000;
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #00ffcc;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px 13px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: #6c6c8c;
        }

        .input-group input:focus {
            border-color: #00ffcc;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .form-options a {
            color: #00ffcc;
            text-decoration: none;
            transition: 0.2s;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #00ffcc, #007bff);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3);
            margin-bottom: 12px;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-skip {
            width: 100%;
            padding: 13px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-skip:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .footer-credit {
            margin-top: 22px;
            text-align: center;
            font-size: 11px;
            color: #7b7b9e;
        }

        .footer-credit span {
            color: #00ffcc;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <h1>P/J AI Photo Editor</h1>
            <p>Next-Gen Artificial Intelligence Suite</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active">Sign In</button>
            <button class="tab-btn">Register</button>
        </div>

        <form action="dashboard.html" method="GET">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" placeholder="Enter your Email ID" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Enter your Password" required>
            </div>

            <div class="form-options">
                <label style="font-size: 11px; color: #9b9bb5; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" style="accent-color: #00ffcc;"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit">Login to Dashboard</button>
        </form>

        <a href="dashboard.html" class="btn-skip">Skip</a>

        <div class="footer-credit">
            <p>Developed by <span>PrinCce Jutt</span></p>
        </div>
    </div>

</body>
</html>
