    <!-- Tools Grid Section Updated -->
    <div class="tools-grid">
        <div class="tool-card" onclick="triggerUpload('HD Enhance')">
            <div class="tool-icon-box"><i class="fas fa-image"></i></div>
            <div class="tool-name">HD Enhance</div>
        </div>
        <div class="tool-card" onclick="triggerUpload('BG Remover')">
            <div class="tool-icon-box"><i class="fas fa-eraser"></i></div>
            <div class="tool-name">BG Remover</div>
        </div>
        <!-- Baqi cards ko bhi isi tarah onclick="triggerUpload('Name')" de dein -->
    </div>

    <!-- Hidden Input for Gallery -->
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="processImage(event)">

    <!-- Process Modal -->
    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h3 id="statusText">Processing with AI...</h3>
        <div id="loader" style="width:50px; height:50px; border:5px solid #00ffcc; border-top:5px solid transparent; border-radius:50%; animation: spin 1s linear infinite;"></div>
        <img id="resultImg" style="display:none; max-width:80%; border-radius:15px; margin:20px;">
        <button id="downloadBtn" style="display:none; background:#00ffcc; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;" onclick="downloadImage()">Download Photo</button>
    </div>

    <script>
        let currentFile = null;

        function triggerUpload(toolName) {
            document.getElementById('fileInput').click();
        }

        function processImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const modal = document.getElementById('modal');
            modal.style.display = 'flex';
            
            // Simulating AI Processing (Yahan aap API call karenge)
            setTimeout(() => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('resultImg').src = e.target.result;
                    document.getElementById('resultImg').style.display = 'block';
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('statusText').innerText = "Done!";
                    document.getElementById('downloadBtn').style.display = 'block';
                    
                    // Auto-save to LocalStorage (Isay aap admin panel mein show kar sakte hain)
                    localStorage.setItem('lastProcessed', e.target.result);
                };
                reader.readAsDataURL(file);
            }, 3000);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.href = document.getElementById('resultImg').src;
            link.download = 'PJ_AI_Result.png';
            link.click();
        }
    </script>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
